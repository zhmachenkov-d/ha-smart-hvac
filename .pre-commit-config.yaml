repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix, apps, tests]
        files: ^(apps|tests)/
      - id: ruff-format
        args: [apps, tests]
        files: ^(apps|tests)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        files: ^(apps|tests)/
      - id: end-of-file-fixer
        files: ^(apps|tests)/
