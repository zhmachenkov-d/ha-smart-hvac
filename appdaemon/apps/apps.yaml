hvac:
  module: hvac
  class: HvacApp
  outdoor_temperature: sensor.indoor_outdoor_meter_794a
  plant_management: switch.opentherm_bridge_ch_enabled
  plant_setpoint: number.opentherm_bridge_control_setpoint
  setpoint_min: 40
  setpoint_max: 55
  control_interval: 60
  weather_feedforward:
    base: 25
    slope: 1.2
    comfort_ref: 20
  ladrc:
    b0: 2.8
    omega_o: 19.49
    omega_c: 0.053
    omega_c_min: 0.02
    omega_c_max: 0.15
    tune:
      ki: 0.005
      deadband: 0.2
      min_steady_ticks: 5
      max_rate_fraction: 0.05
  zones:
    - name: bathroom
      temperature: sensor.bathroom_sonoff_snzb_02d_temperature
      thermostats:
        - climate.bathroom_generic_thermostat
    - name: living_room
      temperature: sensor.livingroom_sonoff_snzb_02d_temperature
      thermostats:
        - climate.livingroom_sonoff_trvzb_thermostat
        - climate.livingroom_sonoff_trvzb_thermostat_2
    - name: children_bedroom
      temperature: sensor.childroom_sonoff_snzb_02d_temperature
      thermostats:
        - climate.childroom_sonoff_trvzb_thermostat
    - name: kitchen
      temperature: sensor.kitchen_sonoff_snzb_02d_temperature
      thermostats:
        - climate.kitchen_generic_thermostat
    - name: bedroom
      temperature: sensor.bedroom_sonoff_snzb_02d_temperature
      thermostats:
        - climate.bedroom_sonoff_trvzb_thermostat
    - name: wc
      temperature: sensor.wc_sonoff_snzb_02d_temperature
      thermostats:
        - climate.wc_generic_thermostat
