[project]
name = "ha-smart-hvac"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["appdaemon==4.5.13"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "pre-commit>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps"]

[tool.ruff]
target-version = "py312"
src = ["apps", "tests"]
exclude = [".cursor", ".agents", "_bmad"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
